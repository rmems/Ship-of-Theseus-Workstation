name: System report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install report validator
        run: python -m pip install --requirement requirements.txt
      - name: Run system-report tests
        run: python -m unittest -v tests/test_theseus_report.py
      - name: Check command entry point
        run: scripts/theseus-report --help
