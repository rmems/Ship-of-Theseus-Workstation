name: System report

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install report validator
        run: python -m pip install --requirement requirements.txt
      - name: Run system-report tests
        run: python -m unittest -v tests/test_theseus_report.py
      - name: Check command entry point
        run: scripts/theseus-report --help
