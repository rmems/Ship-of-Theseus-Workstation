name: Portable CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portable-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz' | sha256sum -c -
          tar -xf shellcheck.tar.xz
          echo "$PWD/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Verify pinned ShellCheck
        run: shellcheck --version | grep -qx 'version: 0.11.0'
      - name: ShellCheck all repository scripts
        run: shellcheck scripts/*.sh
